<div class="login-container">
  <h1 class="main-title">Supermercado</h1>

  <div class="login-card">
    <div class="card-header">
      <h2>Iniciar Sesion</h2>
    </div>

    <form class="login-form">
      <div class="input-group">
        <input type="text" placeholder="Correo" name="correo" [(ngModel)]="correo">
      </div>

      <div class="input-group">
        <input type="password" placeholder="Contraseña" name="password" [(ngModel)]="password">
      </div>
      
      <!-- Agregamos un botón para completar el formulario -->
      <button type="button" class="login-button" (click)="ingresar()">Entrar</button>
    </form>
  </div>
</div>
