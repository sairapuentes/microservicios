<div class="contenido">
    <div class="cabecera">
        <h1>Gestión de Usuarios/h1>
        <button class="btn-nuevo" (click)="nuevoUsuario()">+ Nuevo Usuario</button>
    </div>
    <div class="busqueda">
        <input type="text" placeholder="Buscar Usuario..." [(ngModel)]="buscar" (keyup)="buscarUsuarios()">
        <button (click)="buscarUsuarios()">Buscar</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Sede</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let usuario of usuariosFiltrados()">
                <td>{{usuario.cedulaUsuario}}</td>
                <td>{{usuario.nombreUsuario}}</td>
                <td>{{usuario.correoUsuario}}</td>
                <td>{{usuario.rolUsuario}}</td>
                <td>{{usuario.sedeUsuario}}</td>
                <td class="acciones">
                    <button class="btn-editar" (click)="editarUsuario(usuario.idUsuario)">✏️</button>
                    <button class="btn-eliminar" (click)="eliminarUsuario(usuario.idUsuario)">🗑️</button>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="paginacion">
        <button>Anterior</button>
        <span>1</span>
        <button>Siguiente</button>
    </div>

    <div class="modal-backdrop" *ngIf="mostrarModal()">
    
    <div class="modal">
        <div class="modal-header">
            <h2>{{tituloModal}}</h2>
            <button class="btn-cerrar" (click)="cerrarModal()"> X </button>
        </div>
        <div class="modal-body">

            <label>Cedula</label>
            <input type="number" [ngModel]="usuario().idUsuario" (ngModelChange)="usuario.update(c => ({...c, idUsuario: $event}))">
            
            <label>Nombre</label>
            <input type="text" [ngModel]="usuario().nombreUsuario" (ngModelChange)="usuario.update(c => ({...c, nombreUsuario: $event}))">

            <label>Correo Electronico</label>
            <input type="text" [ngModel]="usuario().correoUsuario" (ngModelChange)="usuario.update(c => ({...c, correoUsuario: $event}))">

            <label>Rol</label>
            <select type="number" [ngModel]="usuario().idRol" (ngModelChange)="usuario.update(i => ({...i, idRol: $event}))">
                <option [ngValue]="0">Seleccione un rol</option>
                <option *ngFor="let rol of roles()" [ngValue]="rol.idSede">{{rol.nombreRol}}</option> 
            </select>

            <label>Sede</label>
            <select type="number" [ngModel]="usuario().idSede" (ngModelChange)="usuario.update(i => ({...i, idSede: $event}))">
                <option [ngValue]="0">Seleccione una sede</option>
                <option *ngFor="let sede of sedes()" [ngValue]="sede.idSede">{{sede.nombreSede}}</option> 
            </select>
        </div>
        <div class="modal-footer">
            <button class="btn-guardar" (click)="guardarCliente()">Guardar</button>
            <button class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>
