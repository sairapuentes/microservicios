<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/static/estilo.css"></link>
    <link rel="stylesheet" href="/static/bootstrap.min.css"></link>
    <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">-->
</head>
<body>
   <div id="contenedor">
       <div class="justify-content-center">
           <h1 class="text-secondary">Supermercado</h1>
           <div class="card text-center text-white bg-success mb-3" style="max-width: 20rem;">
               <div class="card-header">Iniciar Sesion</div>
               <div class="card-body">
                   <form>
                       <!-- input usuario -->
                       <div class="form-group mb-4">
                           <input type="text" id="form2Example1" class="form-control" placeholder="Usuario"/>
                       </div>

                       <!-- input contraseña-->
                       <div class="form-group mb-4">
                           <input type="password" id="form2Example2" class="form-control" placeholder="Contraseña"/>
                       </div>
                   </form>
                   <div class="card-footer text-body-secondary">
                       <!-- Submit button -->
                       <button type="button" class="btn btn-secondary btn-block mb-4" >Ingresar</button>
                   </div>
                   </form>
               </div>
           </div>
       </div>
   </div>
</body>
</html>
