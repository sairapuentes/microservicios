services:
  # BASE DE DATOS MYSQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: supermercado
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    ports:
      - "3307:3306"
    networks:
      - micro-net
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # CONFIG SERVER
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - micro-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  # EUREKA
  eureka:
    build: ./eureka
    container_name: eureka
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - micro-net

  # GATEAWAY
  gateaway:
    build: ./gateaway
    container_name: gateaway
    ports:
      - "8090:8090"
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - micro-net

  # LOGIN
  login:
    build: ./login
    container_name: login
    ports:
      - "8010:8010"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - micro-net

  # PRODUCTOS
  productos:
    build: ./productos
    container_name: productos
    ports:
      - "8011:8011"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_started
      ventas:
        condition: service_started
    networks:
      - micro-net

  # CLIENTES
  clientes:
    build: ./clientes
    container_name: clientes
    ports:
      - "8012:8012"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - micro-net

  # VENTAS
  ventas:
    build: ./ventas
    container_name: ventas
    ports:
      - "8013:8013"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - micro-net

  # CONSOLIDADO
  consolidado:
    build: ./consolidado
    container_name: consolidado
    ports:
      - "8014:8014"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - micro-net

networks:
  micro-net:
    driver: bridge

volumes:
  mysql_data: