server:
  port: 8090

spring:
  application:
    name: gateaway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false #nos ayuda a enrutar los servicios#          lower-case-service-id: true
      routes:
        - id: productos
          uri: lb://PRODUCTOS  # ← Mayúsculas como aparece en Eureka
          predicates:
            - Path=/api/productos/**

        - id: ventas
          uri: lb://VENTAS
          predicates:
            - Path=/api/ventas/**

        - id: clientes
          uri: lb://CLIENTES
          predicates:
            - Path=/api/clientes/**

        - id: login
          uri: lb://LOGIN
          predicates:
            - Path=/api/auth/**

        - id: consolidado
          uri: lb://CONSOLIDADO
          predicates:
            - Path=/api/consolidado/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka:8761/eureka/
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
