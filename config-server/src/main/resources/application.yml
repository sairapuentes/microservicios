server:
  port: 8888

spring:
  profiles:
    active: native
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: file:/configurations

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false